name: Code Quality

# Only run on branches (e.g. not tags)
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      # Pinned deliberately: the action otherwise installs whatever ruff was
      # released last, so an unchanged tree starts failing when upstream adds a
      # rule. The project's own requirements pin the version it was written for.
      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: Check formatting
        run: ruff format --check .

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: Run ruff
        run: ruff check .

  type-checking:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install MyPy
        run: pip install mypy hypothesis pytest pytest-mock fastnumbers setuptools_scm

      - name: Create _version.py file
        run: python -m setuptools_scm --force-write-version-files

      - name: Run MyPy
        run: mypy --strict natsort tests

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install Validators
        run: pip install twine build

      - name: Run Validation
        run: |
          python -m build
          twine check dist/*
